<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>GPT-Image-1 Demo</title>
  <style>
    body { font-family:sans-serif; max-width:600px; margin:auto; padding:1rem; }
    label { display:block; margin-top:1rem; font-weight:bold; }
    input, textarea, select, button {
      width:100%; padding:0.5rem; margin-top:0.5rem; font-size:1rem;
      box-sizing:border-box;
    }
    button { cursor:pointer; }
    #result img { max-width:100%; margin-top:1rem; }
    #result p { margin-top:1rem; color:red; }
  </style>
</head>
<body>
  <h1>Generate Images with gpt-image-1</h1>

  <form id="prompt-form">
    <label for="api-key">Your OpenAI API Key:</label>
    <input
      id="api-key"
      type="text"
      placeholder="sk-XXXXXXXXXXXXXXXXXXXXXXXX"
      required
    />

    <label for="prompt">Enter your prompt:</label>
    <textarea
      id="prompt"
      rows="4"
      placeholder="Describe the image you want…"
      required
    ></textarea>

    <label for="image-count">Number of images:</label>
    <select id="image-count">
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>

    <button type="submit">Generate</button>
    <button type="reset">Reset</button>
  </form>

  <div id="result"></div>

  <script src="script.js"></script>
</body>
</html>
